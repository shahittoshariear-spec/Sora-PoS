[package]
name = "sora_core"
version = "1.0.0"
edition = "2021"
description = "Native Windows helpers for Sora PoS"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.30"
csv = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Media_Audio",
  "Win32_Security_Credentials",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = true
strip = true
